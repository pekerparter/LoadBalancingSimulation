[Config Final_N2_Low]
extends = ExperimentBase
description = "2 servers, rho approximately 0.4"

*.numberOfServers = 2
*.generator.generationInterval = exponential(1.25s, 0)

*.loadBalancer.algorithm = ${alg="roundRobin","random","shortestQueue","powerOfTwo"}

output-scalar-file = ${resultdir}/${configname}_${alg}.sca
output-vector-file = ${resultdir}/${configname}_${alg}.vec


