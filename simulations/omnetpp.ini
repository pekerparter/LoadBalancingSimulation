[General]
network = src.LoadBalancingNetwork

sim-time-limit = 30s

num-rngs = 3

**.scalar-recording = true
**.vector-recording = true

[Config ValidationLight]
description = "Deterministic light-load validation (no rng)"

*.generator.generationInterval = 2s
*.generator.numberOfJobs = 10
*.generator.jobServiceTime = 1s

*.loadBalancer.algorithm = "roundRobin"


[Config ValidationOverload]
description = "Deterministic overload validation (no rng)"

*.generator.generationInterval = 0.4s
*.generator.numberOfJobs = 10
*.generator.jobServiceTime = 1s

*.loadBalancer.algorithm = "roundRobin"


[Config StochasticBaseline]
description = "Poisson arrivals and exponential service times"

sim-time-limit = 1000s

*.generator.generationInterval = exponential(0.75s, 0)
*.generator.numberOfJobs = 1000000
*.generator.jobServiceTime = exponential(1s, 1)

*.generator.rng-0 = 0
*.generator.rng-1 = 1
*.loadBalancer.rng-0 = 2

*.loadBalancer.algorithm = "roundRobin"

[Config TestRandom]
extends = StochasticBaseline
*.loadBalancer.algorithm = "random"


[Config TestShortestQueue]
extends = StochasticBaseline
*.loadBalancer.algorithm = "shortestQueue"


[Config TestPowerOfTwo]
extends = StochasticBaseline
*.loadBalancer.algorithm = "powerOfTwo"


[Config ExperimentBase]
description = "Common settings for stochastic experiments"

sim-time-limit = 1100s
warmup-period = 100s

*.generator.numberOfJobs = 1000000
*.generator.jobServiceTime = exponential(1s, 1)

*.server[*].measurementStart = 100s

*.generator.rng-0 = 0
*.generator.rng-1 = 1
*.loadBalancer.rng-0 = 2

repeat = 10


[Config LowLoad]
extends = ExperimentBase
description = "Low offered load"
*.generator.generationInterval = exponential(1.25s, 0)


[Config MediumLoad]
extends = ExperimentBase
description = "Medium offered load"
*.generator.generationInterval = exponential(0.7142857s, 0)


[Config HighLoad]
extends = ExperimentBase
description = "High offered load"
*.generator.generationInterval = exponential(0.5555556s, 0)


[Config LowRoundRobin]
extends = LowLoad
*.loadBalancer.algorithm = "roundRobin"

[Config LowRandom]
extends = LowLoad
*.loadBalancer.algorithm = "random"

[Config LowShortestQueue]
extends = LowLoad
*.loadBalancer.algorithm = "shortestQueue"

[Config LowPowerOfTwo]
extends = LowLoad
*.loadBalancer.algorithm = "powerOfTwo"


[Config MediumRoundRobin]
extends = MediumLoad
*.loadBalancer.algorithm = "roundRobin"

[Config MediumRandom]
extends = MediumLoad
*.loadBalancer.algorithm = "random"

[Config MediumShortestQueue]
extends = MediumLoad
*.loadBalancer.algorithm = "shortestQueue"

[Config MediumPowerOfTwo]
extends = MediumLoad
*.loadBalancer.algorithm = "powerOfTwo"


[Config HighRoundRobin]
extends = HighLoad
*.loadBalancer.algorithm = "roundRobin"

[Config HighRandom]
extends = HighLoad
*.loadBalancer.algorithm = "random"

[Config HighShortestQueue]
extends = HighLoad
*.loadBalancer.algorithm = "shortestQueue"

[Config HighPowerOfTwo]
extends = HighLoad
*.loadBalancer.algorithm = "powerOfTwo"


[Config WarmupHighRoundRobin]
extends = HighRoundRobin
description = "Warm-up diagnostic - high load - Round Robin"

sim-time-limit = 2000s
warmup-period = 0s
*.server[*].measurementStart = 0s

repeat = 5


[Config WarmupHighRandom]
extends = HighRandom
description = "Warm-up diagnostic - high load - Random"

sim-time-limit = 2000s
warmup-period = 0s
*.server[*].measurementStart = 0s

repeat = 5


[Config WarmupHighShortestQueue]
extends = HighShortestQueue
description = "Warm-up diagnostic - high load - Shortest Queue"

sim-time-limit = 2000s
warmup-period = 0s
*.server[*].measurementStart = 0s

repeat = 5


[Config WarmupHighPowerOfTwo]
extends = HighPowerOfTwo
description = "Warm-up diagnostic - high load - Power of Two"

sim-time-limit = 2000s
warmup-period = 0s
*.server[*].measurementStart = 0s

repeat = 5